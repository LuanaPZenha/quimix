[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quimix-auth-service"
version = "0.1.0"
description = "Quimix authentication microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.11.1",
  "pydantic-settings==2.8.1",
  "email-validator==2.2.0",
  "sqlalchemy==2.0.39",
  "psycopg[binary]==3.2.6",
  "bcrypt==4.3.0",
  "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
